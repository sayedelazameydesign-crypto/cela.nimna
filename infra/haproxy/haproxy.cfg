# HAProxy (GPLv2, FOSS) — example front door for 2+ nimna replicas.
#
# What this buys (matches docs/RESILIENCE.md §6):
#   * TLS termination + HTTP->HTTPS redirect at the edge (nimna serves plain HTTP).
#   * Least-conn balancing with `/api/health` checks — an unhealthy replica
#     is pulled out of rotation automatically.
#   * The app is stateless-safe behind it: rate-limit buckets live in Valkey
#     (REDIS_URL), idempotency keys in SQLite (single writer) — see the
#     "single-writer" note in docs/FREE-STACK.md before scaling past 1 writer.
#
# Run (example; adapt cert paths):
#   haproxy -f infra/haproxy/haproxy.cfg
# NGINX/Traefik equivalents are sketched in docs/FREE-STACK.md.

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    # Pass through the app's request ID; add one if the client sent none.
    http-request set-header X-Request-ID %[uuid()] unless { hdr(X-Request-ID) -m found }

frontend http_in
    bind *:80
    # In production: redirect to HTTPS (needs `bind *:443 ssl crt ...` below).
    # redirect scheme https code 301 if !{ ssl_fc }
    default_backend nimna_api

backend nimna_api
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server nimna1 nimna1:8000 check inter 5s fall 2 rise 2
    server nimna2 nimna2:8000 check inter 5s fall 2 rise 2
