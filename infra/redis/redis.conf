# Valkey 8 — Vision Gateway Cache (256MB, LRU)
# (Redis-format config: Valkey is a fork of Redis 7.2.4, same syntax.)
maxmemory 256mb
maxmemory-policy allkeys-lru
save ""
appendonly no
maxclients 10000
timeout 0
tcp-keepalive 300
databases 1
protected-mode yes
# hit with: valkey-cli --raw info memory
