# Prometheus (Apache-2.0) — minimal scrape config for nimna.
#
# `GET /api/metrics` is behind API-key auth (see nimna/api/telemetry.py), so
# the scraper needs a bearer token: put a dedicated read-only NIMNA_API_KEY
# in a file and reference it (never inline secrets in this file).
#
# Run (example):
#   prometheus --config.file=infra/monitoring/prometheus.yml
# SigNoz alternative (OTLP-native, single binary stack): see docs/FREE-STACK.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: nimna
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/nimna_metrics_token
    static_configs:
      - targets: ["nimna1:8000", "nimna2:8000"]
