services:
  nimna:
    build: .
    image: nimna-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - .env                      # copy .env.example -> .env and add your key
    environment:
      # Safe default: no Docker socket mounted. The Python sandbox runs with
      # subprocess + rlimits and requires approval for run_python.
      # For real isolation, use the local-sandbox profile (see below).
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-subprocess}
    volumes:
      - ./skills:/app/skills:ro    # add a folder -> new skill (POST /api/skills/reload)
      - ./workspace:/app/workspace
      - nimna-data:/app/data
    restart: unless-stopped

  # ── Local sandbox with Docker isolation (development only) ───────────────
  # This service mounts the Docker socket, which grants the container near-
  # host control (can create arbitrary privileged containers) — even read-only
  # mount is not sufficient isolation. Do NOT use in production or untrusted CI.
  # Use only for local development on a machine without sensitive data.
  #
  #   docker compose --profile local-sandbox up nimna-sandbox
  #
  # The default `nimna` service does NOT mount the socket (verify with
  # `docker compose config | grep -F docker.sock` — should return nothing).
  nimna-sandbox:
    extends:
      service: nimna
    profiles: ["local-sandbox"]
    environment:
      SANDBOX_BACKEND: docker
    volumes:
      - ./skills:/app/skills:ro
      - ./workspace:/app/workspace
      - nimna-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  # ── Redis Vision Gateway Cache (profile: infra) ────────────────────────
  # docker compose --profile infra up -d redis
  # Requires REDIS_URL=redis://redis:6379/0 inside the nimna service.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    profiles: ["infra"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 3

  # ── Isolated desktop for Computer Control (VNC + noVNC) ────────────────
  # Provides an Ubuntu LXDE desktop that Nimna can see and click.
  # Isolated from the host — only workspace is shared.
  #   docker compose --profile computer up -d desktop
  #   open http://localhost:6901  (password: nimna, if set)
  # Nimna's Mirror View will show the same desktop via noVNC.
  desktop:
    image: dorowu/ubuntu-desktop-lxde-vnc:focal
    ports:
      - "6901:80"
    environment:
      - RESOLUTION=1280x800
      - VNC_PASSWORD=nimna
      - LANGUAGE=ar
    volumes:
      - ./workspace:/home/ubuntu/workspace:rw
      - desktop-home:/home/ubuntu
    shm_size: 1gb
    profiles: ["computer"]
    restart: unless-stopped
    # no need for privileged; keep it isolated

volumes:
  nimna-data:
  desktop-home:
  redis-data:
