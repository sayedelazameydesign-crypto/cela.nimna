services:
  nimna:
    build: .
    image: nimna-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - .env                      # copy .env.example -> .env and add your key
    environment:
      # docker is the recommended backend (needs the socket mounted below)
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
    volumes:
      - ./skills:/app/skills:ro    # add a folder -> new skill (POST /api/skills/reload)
      - ./workspace:/app/workspace
      - nimna-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock   # required for SANDBOX_BACKEND=docker; comment out to use subprocess
    restart: unless-stopped

volumes:
  nimna-data:
