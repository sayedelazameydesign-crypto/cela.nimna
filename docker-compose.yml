services:
  nimna:
    build: .
    image: nimna-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - .env                      # copy .env.example -> .env and add your key
    environment:
      # Safe default: no Docker socket mounted. The Python sandbox runs with
      # subprocess + rlimits and requires approval for run_python.
      # For real isolation, use the local-sandbox profile (see below).
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-subprocess}
    volumes:
      - ./skills:/app/skills:ro    # add a folder -> new skill (POST /api/skills/reload)
      - ./workspace:/app/workspace
      - nimna-data:/app/data
    restart: unless-stopped

  # ── Local sandbox with Docker isolation (development only) ───────────────
  # This service mounts the Docker socket, which grants the container near-
  # host control (can create arbitrary privileged containers) — even read-only
  # mount is not sufficient isolation. Do NOT use in production or untrusted CI.
  # Use only for local development on a machine without sensitive data.
  #
  #   docker compose --profile local-sandbox up nimna-sandbox
  #
  # The default `nimna` service does NOT mount the socket (verify with
  # `docker compose config | grep -F docker.sock` — should return nothing).
  nimna-sandbox:
    extends:
      service: nimna
    profiles: ["local-sandbox"]
    environment:
      SANDBOX_BACKEND: docker
    volumes:
      - ./skills:/app/skills:ro
      - ./workspace:/app/workspace
      - nimna-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  nimna-data:
