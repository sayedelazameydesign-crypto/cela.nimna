name: CI — Perf + Security Sprint 1
on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Install Nimna package for test imports
        run: pip install -e . --no-deps
      - run: python -m pytest -q --tb=short

  security-blocklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content filter pre-approval must precede approval gate
        run: |
          set -e
          echo "Checking that content filter (RATONALE checks) runs before approval gate in builtin tools..."
          # scoped to builtin tools: base-layer Tool.effective_risk (nimna/tools/base.py)
          # is the LEGITIMATE dynamic-risk hook; a builtin tool redefining its own is the bypass.
          if grep -R "def effective_risk" -n nimna/tools/builtin/; then
            echo "VIOLATION: a builtin tool redefines effective_risk — content filter must not be replaceable"
            exit 1
          fi
          echo "blocklist patterns must EXIST (absence fails — falsifiable):"
          grep -Rq "BLOCKLIST" nimna/tools/builtin/ || { echo "MISSING: blocklist patterns in builtin tools"; exit 1; }
          echo "Checking hidden prompt injection samples are blocked (effect exists in reviews)"
          python3 - << 'PY'
          import pathlib
          cc = pathlib.Path("skills/computer_control/SKILL.md")
          ce = pathlib.Path("skills/code_execution/SKILL.md")
          assert cc.exists() and ce.exists(), "skill split documents missing"
          cct = cc.read_text(encoding="utf-8")
          cet = ce.read_text(encoding="utf-8")
          # computer_control must NEGATE shell_execute; code_execution must own it
          assert "shell_execute" in cet, "code_execution must expose shell_execute explicitly"
          assert "لم يعد ضمن هذه المهارة" in cct, "computer_control must negate shell_execute explicitly"
          kills = [str(f) for f in pathlib.Path("nimna").rglob("*.py")
                   if "should_kill" in f.read_text(encoding="utf-8", errors="ignore")]
          assert kills, "anomaly kill-switch hook missing from production code"
          print("skill split OK; anomaly hook present in", len(kills), "file(s)")

          # BEHAVIORAL gate: a denylisted command must NEVER reach the executor,
          # even with the approval gate switched OFF (auto_approve) — the
          # denylist sits deeper than approval (proven behavior, not grep).
          import os
          os.environ["MODEL_PROVIDER"] = "mock"
          os.environ["DB_PATH"] = ":memory:"
          from unittest import mock as _m
          from nimna.config import Settings
          from nimna.core.agent import Agent
          from nimna.core.approval import DeferToClient
          from nimna.memory import MemoryStore
          from nimna.providers import MockProvider
          from nimna.providers.base import ModelResponse, ToolCall
          from nimna.skills import SkillManager
          from nimna.tools import default_registry
          s2 = Settings.from_env(env_file=None)
          s2.provider = "mock"; s2.verify = False
          s2.db_path = __import__("pathlib").Path(":memory:")
          s2.skills_dir = __import__("pathlib").Path("skills")
          s2.workspace_dir = __import__("pathlib").Path(".")
          s2.auto_approve = True
          ag = Agent(MockProvider(), SkillManager(__import__("pathlib").Path("skills")),
                     default_registry(), MemoryStore(":memory:"), s2,
                     approval_policy=DeferToClient(), workspace=s2.workspace_dir)
          with _m.patch("nimna.tools.builtin.computer._run_with_limits",
                        side_effect=AssertionError("HANDLER SPAWNED!")) as sp:
              ag.provider.queue(ModelResponse(text="", tool_calls=[ToolCall(
                  name="shell_execute",
                  arguments={"command": "rm -rf /", "purpose": "ci-behavioral-probe"})]))
              res = ag.run("probe", session_id="ci-blocklist")
              assert sp.call_count == 0, "DENIED command reached the executor!"
              preview = str(res.tool_calls[0].result_preview).lower()
              assert "blocked" in preview, preview
          print("behavioral gate OK: denylist blocks rm -rf / before the executor (spawn=0)")
          PY

  trivy:
    runs-on: ubuntu-latest
    # Security gates BLOCK. A scanner outage is a RED run a human looks at —
    # not a green run hiding behind advisory masking.
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
      - name: Build image for Trivy (if Dockerfile present)
        if: hashFiles('Dockerfile') != ''
        run: docker build -t nimna-agent:ci .
      - name: Trivy image (nimna-agent) if Dockerfile present
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nimna-agent:ci
          format: table
          severity: "CRITICAL,HIGH"

  zap:
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: mock        # the API refuses to boot without a provider config
      DB_PATH: /tmp/zap-health.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Start API (mock provider — runners have no keys) and PROVE health
        run: |
          nohup python -m uvicorn nimna.api.app:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do curl -sf http://127.0.0.1:8000/api/health > /tmp/health.json && break || sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health || { echo "HEALTH FAILED — server never came up"; exit 1; }
          echo "runtime evidence:"; head -c 400 /tmp/health.json
      - name: Resolve runner address reachable from the ZAP container
        run: echo "ZAP_TARGET=http://$(hostname -I | awk '{print $1}'):8000" >> "$GITHUB_ENV"
      - name: OWASP ZAP Baseline Scan (blocking on FAIL-level findings)
        # The action runs in a container: 127.0.0.1 inside it is NOT the runner,
        # so the target is the runner's own address. fail_action=true makes the
        # scan falsifiable; -I keeps passive warnings advisory while FAIL alerts
        # break the build.
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.ZAP_TARGET }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a -I"

  sandbox-escape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Install Nimna package for sandbox contract
        run: pip install -e . --no-deps
      - name: Ensure default profile does not mount docker.sock
        run: |
          set -e
          # `docker compose config` renders opt-in profile services too, so it
          # is not a valid test of the default service. Inspect the service
          # boundaries directly and keep the socket assertion explicit.
          python3 << 'PY'
          import pathlib
          lines = pathlib.Path("docker-compose.yml").read_text().splitlines()
          start = lines.index("  nimna:")
          sandbox_start = lines.index("  nimna-sandbox:")
          default_block = "\n".join(line for line in lines[start:sandbox_start] if not line.lstrip().startswith("#"))
          sandbox_block = "\n".join(lines[sandbox_start:])
          assert "docker.sock" not in default_block, "default service mounts docker.sock"
          print("default safe")
          assert "docker.sock" in sandbox_block, "sandbox profile missing docker.sock"
          assert "profiles: [\"local-sandbox\"]" in sandbox_block, "docker socket is not opt-in"
          print("sandbox profile OK")
          PY
      - name: Sandbox escape attempt (subprocess backend)
        run: |
          python3 - << 'PY'
          from pathlib import Path
          from nimna.config import Settings
          from nimna.bootstrap import build_agent
          s = Settings.from_env(env_file=None)
          s.provider = "mock"
          s.db_path = Path(":memory:")
          s.verify = False
          s.sandbox_backend = "subprocess"
          s.auto_approve = True
          agent = build_agent(s)
          # try to read /etc/passwd via shell — should be allowed but not escape workspace?
          # the actual protection is rlimits + cwd jail; this test just ensures backend is subprocess
          assert s.sandbox_backend == "subprocess"
          print("backend", s.sandbox_backend, "image", s.sandbox_image)
          # REAL adversarial check: path traversal must be refused by the jail
          import tempfile, pathlib
          from nimna.tools.base import ToolContext
          ws = pathlib.Path(tempfile.mkdtemp())
          ctx = ToolContext(settings=s, workspace=ws, session_id="gate")
          for probe in ("../escape.txt", "/etc/passwd"):
              try:
                  ctx.resolve_path(probe)
                  raise SystemExit(f"JAIL BROKEN: {probe} was not refused")
              except Exception as exc:
                  print(f"jail refused {probe!r}: {type(exc).__name__}")
          print("sandbox-escape check passed (jail enforced)")
          PY

  production-gate:
    runs-on: ubuntu-latest
    needs: [test, security-blocklist, trivy, zap, sandbox-escape]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # ancestor check needs real history
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Install Nimna package for test imports
        run: pip install -e . --no-deps
      - name: Install the dependency auditor
        run: pip install pip-audit
      - name: Production gate (sequential, falsifiable, no masks)
        env:
          PYTHON: python
        run: bash scripts/production_gate.sh
