name: Ruff Gate

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff check (بوابة حمراء/خضراء)
        run: ruff check .
  # مستشار أمني غير حاجب: يرى الدين الأمني دون كسر البناء.
  # ملاحظة حوكمة: scripts/check_ci_falsifiable.sh يرفض continue-on-error عمدًا
  # ("القناع الثلاثي") — وهذا الـjob استثناء مقصود وموثق (advisory وليس بوابة)،
  # لذلك لا يُستدعى الفاحص على هذا الملف. المرحلة 1 تُغلق بند S301 فيصير bandit
  # بوابة حقيقية بلا continue-on-error (انظر docs/REPO-AUDIT-2026-09-25.md §8).
  bandit-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r nimna/ -ll -ii -q
