[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimna"
version = "0.1.0"
description = "Reusable-skills AI agent: SKILL.md progressive loading, scoped tools, SQLite memory, approvals; runs on Gemini (free tier), NVIDIA NIM or any OpenAI-compatible model."
readme = "README.md"
# P1-3 (حسم): توحيد على 3.11 لأن CI وDockerfile والكود (tomllib) كلها عليها فعلًا.
# البديل — إن أردت الإبقاء على 3.10 — تحتاج: requires-python = ">=3.10" + tomli marker بالأسفل
# + تغليف استيراد tomllib في السكربت بـ try/except. لكن التوحيد أبسط وأصدق.
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "fastapi[standard]==0.141.1",
  "uvicorn[standard]==0.53.0",
  "google-genai==2.25.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# P3-5: pytest للتطوير فقط — أُخرج من requirements.txt فعلاً (انظر سجل التنفيذ في تقرير التدقيق)
dev = [
  "pytest==9.1.1",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.8",
  "types-PyYAML",      # أنواع stub لـ pyyaml — يقلل أخطاء mypy الوهمية كثيرًا
]
# P3-4: البنية التحتية الاختيارية — كانت حصرًا في requirements.txt فتضيع من Dockerfile.
# Dockerfile الإنتاج يجب أن يصبح:  pip install ".[infra]"
infra = [
  "redis>=5.0",
  "qdrant-client>=1.9",
  "numpy>=1.26",
  "prometheus-client>=0.20",
]
charts = ["matplotlib==3.8.4"]

[project.scripts]
nimna = "nimna.cli:main"

[tool.setuptools.packages.find]
include = ["nimna*"]

[tool.setuptools.package-data]
nimna = ["api/static/*"]

[tool.fastapi]
entrypoint = "nimna.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ─── P4: تكوين التحليل الساكن (جديد) ─────────────────────────────
# ملاحظة استراتيجية: ابدأ متساهلًا وشدّد تدريجيًا (المرحلة 2 من خطة التدقيق).
# تشغيل أول مرة:  ruff check --statistics  لترتيب الأخطاء حسب الكثافة.

[tool.ruff]
target-version = "py311"
line-length = 100          # عدّلها لاحقًا حسب أسلوب المشروع — لا تستخدم الافتراضي 88 بعناد
src = ["nimna", "tests"]
extend-exclude = [
  # أدلة مجمّدة موقّعة بـ docs/evidence/T7.1/MANIFEST.sha256 —
  # أي تعديل لايتر فيها يكسر سلسلة الأدلة. خارج نطاق اللاينت دائماً.
  "docs",
]

[tool.ruff.lint]
# بدءًا: الأخطاء الواضحة والاستيرادات غير المستخدمة + الأمن الأساسي.
# B = bugbear, S = bandit-rules داخل ruff (لا يغني عن bandit الكامل لكنه يصطاد الظاهر)
select = ["E", "F", "W", "I", "B", "UP", "S"]
# استبعادات — بحوكمة: كل بند دين يحمل وسم TODO(phase*) قابل للبحث
# (grep "TODO(phase" pyproject.toml). عند إغلاق مرحلة: احذف سطورها وشغّل
# ruff check — إما أخضر أو قائمة أعمال جديدة. لا يُضاف بند دون وسم.
ignore = [
  # ── أساس التكوين (من إنشاء التكوين — خارج عدّ الديون) ──
  "E501",   # طول السطر — أعد تفعيله بعد ruff format
  "B008",   # استدعاءات في الافتراضيات — شائعة في FastAPI (Query(...) إلخ)
  "S101",   # assert — مسموح في الاختبارات والكود الفعلي له استخدامات

  # ══ إنذارات كاذبة موثقة — دائم، لا وسم زمني ══
  "S105",  # "PASS"/"SECRET" رمزية — موثق في تقرير التدقيق §6
  "S608",  # SQL parameterized بالكامل في store.py — موثق في تقرير التدقيق §6

  # ══ دين أمني — مؤقت بموعد، يُصلح في المرحلة 1 (P2-*) ══
  "S110",       # TODO(phase1): try-except-pass → logging بالسياق (48 موضعًا)
  "S112",       # TODO(phase1): try-except-continue → logging (4)
  "S603","S607",# TODO(phase1): subprocess — مسارات مطلقة (10+6)
  "S104",       # TODO(phase1-P2-3): افتراض ربط 0.0.0.0 (4)
  # S301 غير موجود هنا — أُصلح فعلاً في 2026-09-25: codec كاش الرؤية = JSON
  # موقّع ببادئة J1، لا pickle إطلاقًا (انظر § decision-S301 في تقرير التدقيق)
  # S324 غير موجود هنا — أُصلح فعليًا في 2026-09-25: sha256 بدل md5 ×6
  # (لا عقد خارجي مع md5 — تحقق: grep md5 nimna/ scripts/ = 0)

  # ══ دين جودة — يُصلح تدريجيًا في المرحلة 2 ══
  "B904",  # TODO(phase2): raise ... from None (22)
  "E402",  # TODO(phase2): imports في مواضع مقصودة (12)
  "E702",  # TODO(phase2): فواصل منقوطة (12)
  "UP042", # TODO(phase2): str-enum → StrEnum (13)
  "B905",  # TODO(phase2): zip(..., strict=) (4)
  "B007", "E741", "E731", "UP007", "UP031", "B005", "B018", "I001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]                      # لا أمن داخل الاختبارات
"scripts/**" = ["S"]                    # سكربتات داخلية موثوقة
# الملفات التي فيها md5/pickle المذكورة في التدقيق — عالجها في المرحلة 1 لا الآن:
# "nimna/.../X.py" = ["S324"]  # md5 — فعّل هذا السطر مؤقتًا حتى تستبدلها

[tool.ruff.lint.isort]
known-first-party = ["nimna"]

[tool.mypy]
python_version = "3.11"
# ابدأ متساهلًا — 88 خطأً لا يُصلح دفعة واحدة:
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
# لا تفعّل strict الآن. عندما يصل عدد الأخطاء للصفر ارفع السقف:
# disallow_untyped_defs = true
