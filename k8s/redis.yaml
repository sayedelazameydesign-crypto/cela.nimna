apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    save ""
    appendonly no
    maxclients 10000
    timeout 0
    tcp-keepalive 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimna-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimna-redis
  template:
    metadata:
      labels:
        app: nimna-redis
    spec:
      containers:
      # Valkey (BSD-3) — RESP-compatible Redis replacement; names below keep
      # the `redis` prefix for compatibility (service name, REDIS_URL).
      - name: redis
        image: valkey/valkey:8
        command: ["valkey-server","/usr/local/etc/redis/redis.conf"]
        ports: [{containerPort: 6379}]
        volumeMounts: [{name: config, mountPath: /usr/local/etc/redis/redis.conf, subPath: redis.conf}]
        resources: {requests: {memory: "128Mi", cpu: "100m"}, limits: {memory: "300Mi", cpu: "500m"}}
      volumes:
      - name: config
        configMap: {name: redis-config}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: nimna-redis}
  ports: [{port: 6379, targetPort: 6379}]
