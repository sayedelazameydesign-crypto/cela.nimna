apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimna-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: nimna-api}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata:
      labels: {app: nimna-api}
      # /api/metrics is behind API-key auth (X-Nimna-Key) — the scrape recipe
      # (header-injecting proxy or authenticated cron) is in docs/RESILIENCE.md.
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: "/api/metrics"}
    spec:
      # Spread replicas across nodes, preferring separate zones: a single
      # node (or zone) failure must not take the whole API down.  Preferred
      # (not required) so small clusters still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector: {matchLabels: {app: nimna-api}}
              topologyKey: kubernetes.io/hostname
          - weight: 50
            podAffinityTerm:
              labelSelector: {matchLabels: {app: nimna-api}}
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: api
        image: nimna-agent:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000, name: http}]
        env:
        - {name: PORT, value: "8000"}
        - {name: REDIS_URL, value: "redis://redis:6379/0"}
        - {name: VISION_CACHE_TTL, value: "600"}
        - {name: QDRANT_URL, value: "http://qdrant:6333"}
        - {name: EMBEDDING_MODEL, value: "text-embedding-004"}
        - {name: EMBEDDING_PROVIDER, value: "auto"}
        - {name: SANDBOX_BACKEND, value: "subprocess"}
        - {name: MODEL_PROVIDER, valueFrom: {secretKeyRef: {name: nimna-secrets, key: MODEL_PROVIDER, optional: true}}}
        - {name: GEMINI_API_KEY, valueFrom: {secretKeyRef: {name: nimna-secrets, key: GEMINI_API_KEY, optional: true}}}
        # API auth: NOT optional — the pod must not start without it (the app also refuses to boot)
        - {name: NIMNA_ENV, value: "production"}
        - {name: NIMNA_API_KEY, valueFrom: {secretKeyRef: {name: nimna-secrets, key: NIMNA_API_KEY}}}
        envFrom: [{configMapRef: {name: nimna-config, optional: true}}]
        readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 8, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
        resources: {requests: {memory: "256Mi", cpu: "200m"}, limits: {memory: "800Mi", cpu: "1000m"}}
      terminationGracePeriodSeconds: 30
---
# Voluntary disruptions (node drains, cluster upgrades) must never take all
# replicas at once: with replicas=2 this keeps at least one pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nimna-api-pdb
spec:
  minAvailable: 1
  selector: {matchLabels: {app: nimna-api}}
---
apiVersion: v1
kind: Service
metadata:
  name: nimna-api
spec:
  selector: {app: nimna-api}
  ports: [{port: 80, targetPort: 8000, name: http}]
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nimna-config
data:
  AGENT_MAX_STEPS: "12"
  AGENT_MAX_TOOL_CALLS: "30"
