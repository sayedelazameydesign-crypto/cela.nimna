apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nimna-api-hpa
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: nimna-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  - type: Resource
    resource: {name: memory, target: {type: Utilization, averageUtilization: 75}}
  - type: Pods
    pods: {metric: {name: active_websockets}, target: {type: AverageValue, averageValue: "80"}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 30, policies: [{type: Pods, value: 2, periodSeconds: 30}, {type: Percent, value: 80, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 120, policies: [{type: Pods, value: 1, periodSeconds: 60}]}
---
# PubSub for session sync — Redis is the broker; no extra CRD needed.
# Each pod subscribes to `nimna:sessions` channel on startup:
#   SUBSCRIBE nimna:sessions
# On pending approval creation, publisher does:
#   PUBLISH nimna:sessions '{"type":"pending","session_id":"...","run_id":"..."}'
# Pods invalidate local cache and reload from DB. This keeps pending_runs consistent across replicas.
# See nimna/memory/store.py — already DB-backed (SQLite WAL / Postgres), Redis only for pubsub + vision cache.
# For Postgres: set DB_PATH=postgresql://... and pending sync is DB-native; Redis pubsub is still used for WS broadcast.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpa-notes
data:
  README.md: |
    HPA requires metrics-server and (for WS metric) prometheus-adapter.
    Expose `active_websockets` via /metrics (prometheus_client).
    Without adapter, HPA still works on CPU/memory.
    PubSub: no K8s resource — code in nimna/api/app.py publishes to Redis.
